# ============================================
# 📈 HPA - Horizontal Pod Autoscaler
# ============================================
# HPA otomatis naik/turun jumlah pod berdasarkan penggunaan CPU/RAM
# Kalau banyak pengunjung → tambah pod
# Kalau sepi → kurangi pod

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: inventorygudang-hpa
  namespace: inventorygudang
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: inventorygudang-app
  minReplicas: 2      # Minimum 2 pod
  maxReplicas: 10     # Maximum 10 pod
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70  # Kalau CPU > 70%, tambah pod
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80  # Kalau RAM > 80%, tambah pod
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # Tunggu 5 menit sebelum kurangi pod
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15

